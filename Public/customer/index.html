<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111e2c">
  <title>Taxi Liberec | Objednat taxi v Liberci</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="/taximetr.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/taximetr-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynhpgHYQEpGKO1MydlZLhykYfjhk=" crossorigin="">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main id="auth">
    <section class="auth-card">
      <div class="brand"><img src="/taximetr-192.png" alt="" width="46" height="46"><div><b>Taxi Liberec</b><small>Taxi Liberec</small></div></div>
      <h1 id="auth-title">Přihlášení</h1>
      <form id="login">
        <label>Přihlašovací jméno<input name="username" required autocomplete="username" maxlength="40" autocapitalize="none"></label>
        <label>Heslo<input name="password" type="password" required autocomplete="current-password" maxlength="128"></label>
        <button class="primary" type="submit">Přihlásit se</button>
      </form>
      <form id="register" hidden>
        <div class="columns">
          <label>Jméno<input name="firstName" required maxlength="60" autocomplete="given-name"></label>
          <label>Příjmení<input name="lastName" required maxlength="60" autocomplete="family-name"></label>
        </div>
        <label>Telefonní číslo<input name="phone" type="tel" required maxlength="32" autocomplete="tel"></label>
        <label>E-mail<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
        <label>Přihlašovací jméno<input name="username" required minlength="3" maxlength="40" autocomplete="username" autocapitalize="none"></label>
        <label>Heslo (nejméně 12 znaků)<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
        <button class="primary" type="submit">Vytvořit účet</button>
      </form>
      <p id="auth-error" role="alert"></p>
      <button id="switch-auth" class="text-button" type="button">Vytvořit účet</button>
    </section>
  </main>
  <main id="app" hidden>
    <div id="map" aria-label="Mapa Liberce a vaše poloha"></div>
    <header class="map-header">
      <button id="open-menu" class="floating" type="button" aria-label="Otevřít menu">☰</button>
      <div class="brand map-brand"><img src="/taximetr-192.png" alt="" width="34" height="34"><b>Taxi Liberec</b></div>
      <button id="locate" class="floating" type="button" aria-label="Zobrazit moji polohu">◎</button>
    </header>
    <p id="map-message" role="status" hidden></p>
    <div class="map-actions">
      <button id="last-ride" type="button" hidden></button>
      <button id="book" class="primary" type="button">Objednat jízdu</button>
    </div>
    <dialog id="menu" aria-labelledby="menu-title">
      <div class="dialog-head"><h2 id="menu-title">Taxi Liberec</h2><button type="button" class="close" data-close aria-label="Zavřít menu">×</button></div>
      <p id="customer-name"></p>
      <nav aria-label="Menu zákazníka">
        <button type="button" data-page="booking">Objednat jízdu</button>
        <button type="button" data-page="history">Moje historie jízd</button>
        <button type="button" data-page="offers">Moje akce</button>
        <button type="button" data-page="contacts">Kontakty</button>
        <button type="button" data-page="profile">Nastavení účtu</button>
      </nav>
      <button type="button" id="logout" class="text-button">Odhlásit</button>
      <p id="menu-error" role="alert"></p>
    </dialog>
    <dialog id="panel" aria-labelledby="panel-title">
      <div class="dialog-head"><h2 id="panel-title"></h2><button type="button" class="close" data-close aria-label="Zavřít">×</button></div>
      <p id="panel-message" role="status"></p>
      <section id="booking" hidden>
        <form id="ride">
          <label>Adresa vyzvednutí<input name="pickup" required maxlength="200"></label>
          <div class="address-actions"><button type="button" data-search="pickup">Vyhledat adresu</button><button type="button" id="pick-on-map">Vybrat na mapě</button></div>
          <div class="suggestions" id="pickup-suggestions"></div>
          <label>Cílová adresa<input name="dropoff" required maxlength="200"></label>
          <div class="address-actions"><button type="button" data-search="dropoff">Vyhledat adresu</button></div>
          <div class="suggestions" id="dropoff-suggestions"></div>
          <label>Vyzvednutí<select name="timing"><option value="now">Co nejdřív</option><option value="later">Na určitý čas</option></select></label>
          <label id="scheduled-label" hidden>Datum a čas (Česko)<input name="scheduled" type="datetime-local" disabled></label>
          <fieldset><legend>Platba po jízdě</legend><div class="payment"><label><input type="radio" name="payment" value="cash" checked> Hotově</label><label><input type="radio" name="payment" value="card"> Kartou u řidiče</label></div></fieldset>
          <button class="primary" type="submit">Odeslat objednávku</button>
        </form>
      </section>
      <section id="history" hidden><div id="rides"></div></section>
      <section id="offers" hidden><div id="offer-list"></div></section>
      <section id="contacts" hidden><div id="contact-list"></div></section>
      <section id="profile" hidden>
        <form id="profile-form">
          <label>Přihlašovací jméno<input name="username" autocomplete="username" required minlength="3" maxlength="40" autocapitalize="none"></label>
          <label>E-mail<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
          <label>Telefonní číslo<input name="phone" type="tel" autocomplete="tel" required maxlength="32"></label>
          <label>Stávající heslo<input name="currentPassword" type="password" autocomplete="current-password" required maxlength="128"></label>
          <label>Nové heslo (volitelné)<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128"></label>
          <button class="primary" type="submit">Uložit změny</button>
        </form>
      </section>
    </dialog>
  </main>
</body>
</html>
